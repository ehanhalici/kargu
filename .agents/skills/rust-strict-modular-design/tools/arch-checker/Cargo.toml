[package]
name = "arch-checker"
version = "0.1.0"
edition = "2024"
publish = false
description = "AST gate for the rust-strict-modular-design rules."

# A standalone tool: not part of any workspace.
[workspace]

[dependencies]
syn = { version = "2.0", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "deny"

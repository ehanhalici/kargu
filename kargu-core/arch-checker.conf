# rust-strict-modular-design contract for kargu-core (see
# .agents/skills/rust-strict-modular-design/references/04_GIT_HOOK_GATE.md).
# The longest matching prefix decides a file's role.
#
# Pure core: everything not listed below.  No I/O, clock reads, tokio, process,
# environment, printing, include!, or mutable statics.
domain = src
# Protocol edge: JSON-RPC/API wire translation may expose primitives.
edge = src/ipc src/api/wire src/main.rs src/lib.rs src/error.rs src/constants.rs
# Imperative shell: actors, workers and adapters that perform effects.  Moving a
# file here is a reviewed decision; prefer extracting its pure part instead.
shell = src/api/authority.rs
shell = src/api/auth.rs
shell = src/api/domain.rs
shell = src/api/http.rs
shell = src/api/mod.rs
shell = src/api/resilience/breaker.rs
shell = src/api/resilience/domain.rs
shell = src/api/resilience/retry_after.rs
shell = src/api/resilience/retry.rs
shell = src/application/claim.rs
shell = src/application/history.rs
shell = src/application/host.rs
shell = src/application/mod.rs
shell = src/configuration/read/mod.rs
shell = src/domain/deadline.rs
shell = src/domain/output.rs
shell = src/edit/journal/retention.rs
shell = src/edit/journal/storage.rs
shell = src/edit/prepare/capture.rs
shell = src/edit/prepare/git.rs
shell = src/edit/prepare/parent.rs
shell = src/edit/prepare/service.rs
shell = src/edit/prepare/types.rs
shell = src/history/upload.rs
shell = src/process/activity.rs
shell = src/process/io.rs
shell = src/process/mod.rs
shell = src/process/records.rs
shell = src/process/stdio.rs
shell = src/process/termination.rs
shell = src/providers/mod.rs
shell = src/security/action_snapshot.rs
shell = src/security/catalog.rs
shell = src/security/delegated.rs
shell = src/security/editor.rs
shell = src/security/file.rs
shell = src/security/mod.rs
shell = src/security/read_target.rs
shell = src/workspace/command.rs
shell = src/workspace/git/mutation/scope.rs
shell = src/workspace/git/profile.rs
shell = src/workspace/git/query.rs
shell = src/workspace/git/repository.rs
shell = src/workspace/mod.rs
shell = src/workspace/probe/mod.rs
shell = src/workspace/search.rs
shell = src/workspace/skills/discover.rs
shell = src/workspace/webfetch/mod.rs
shell = src/workspace/webfetch/policy.rs
max-statements = 15
max-params = 3
max-nesting = 3

[package]
name = "kargu-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Owned, bounded stdio core for the Kargu Emacs client"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
uuid = { version = "1", features = ["v4"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

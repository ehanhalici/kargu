[package]
name = "kargu-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Owned, bounded stdio core for the Kargu Emacs client"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
globset = "0.4"
getrandom = "0.4"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
uuid = { version = "1", features = ["v4"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
